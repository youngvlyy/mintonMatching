server {
    listen 80;
    server_name mintonminchin.shop www.mintonminchin.shop;
    return 301 https://mintonminchin.shop$request_uri;
}

server {
    listen 443 ssl;
    server_name mintonminchin.shop www.mintonminchin.shop;

    # certbot이 발급한 인증서 (certbot 실행 후 자동 생성됨)
    ssl_certificate     /etc/letsencrypt/live/mintonminchin.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mintonminchin.shop/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ec2-user/minton-matching/client/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + Socket.io 프록시
    location /api/ {
        proxy_pass         http://localhost:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
