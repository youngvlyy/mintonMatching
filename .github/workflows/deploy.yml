name: CI / Deploy to EC2

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ──────────────────────────────────────────
  # CI: 빌드 + dist/ → EC2 SCP 복사
  # ──────────────────────────────────────────
  build:
    name: CI — Build & SCP
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            backend/package-lock.json

      - name: 프론트엔드 의존성 설치 및 빌드
        run: npm install && npm run build
        working-directory: client

      - name: 백엔드 의존성 설치 및 빌드
        run: npm install && npm run build
        working-directory: backend

      - name: dist/ + nginx 설정 → EC2 SCP 복사
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "client/dist,backend/dist,nginx"
          target: ~/minton-matching

  # ──────────────────────────────────────────
  # CD: pm2 restart (CI 통과 + push 시에만 실행)
  # ──────────────────────────────────────────
  deploy:
    name: CD — pm2 restart
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: nginx 설정 반영 + pm2 재시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo cp ~/minton-matching/nginx/minton-matching.conf /etc/nginx/conf.d/minton-matching.conf
            sudo nginx -t && sudo nginx -s reload
            pm2 restart all
